<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <!-- Rendered by render_slides.mjs at the canvas picture size (e.g. 1920x1080). One message per slide, numbers first. -->
  <style>
    :root { --background: #0f172a; --text: #f8fafc; --muted: #94a3b8; --accent: #10a36b; }
    * { box-sizing: border-box; margin: 0; }
    body { height: 100vh; display: grid; place-content: center; gap: 32px; padding: 96px;
           background: var(--background); color: var(--text); font-family: "Segoe UI", "Helvetica Neue", Arial, "Noto Sans", "DejaVu Sans", sans-serif; text-align: center; }
    .label { font-size: 44px; color: var(--muted); }
    .number { font-size: 220px; font-weight: 800; color: var(--accent); line-height: 1; }
    .caption { font-size: 56px; font-weight: 600; }
  </style>
</head>
<body>
  <p class="label">Lượt tìm theo món</p>
  <p class="number">×2</p>
  <p class="caption">sau một tuần ra mắt</p>
</body>
</html>
